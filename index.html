<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秦彻 · 专属回忆</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<style>
/* ============ CSS Variables ============ */
:root {
  --bg: #050505;
  --bg-card: #0d0d0d;
  --red: #c41e3a;
  --red-dark: #6b0000;
  --red-glow: #ff2d2d;
  --red-dim: #3a0000;
  --gold: #c9a96e;
  --text: #d4c5b9;
  --text-light: #f0e6dc;
  --text-muted: #8a7e72;
  --border: #1a1a1a;
}

/* ============ Reset & Base ============ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: var(--red-dark) var(--bg);
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--red-dark); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--red); }

body {
  font-family: 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  line-height: 1.6;
}

/* ============ Particle Canvas ============ */
#particles {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 1;
}

/* ============ Navigation ============ */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(180deg, rgba(5,5,5,0.95) 0%, rgba(5,5,5,0) 100%);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

nav .logo {
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--red);
  letter-spacing: 4px;
  text-shadow: 0 0 20px rgba(196,30,58,0.5);
  cursor: pointer;
}

nav .links { display: flex; gap: 28px; list-style: none; }

nav .links a {
  color: var(--text-muted);
  text-decoration: none;
  font-size: 0.9rem;
  letter-spacing: 2px;
  transition: all 0.3s ease;
  position: relative;
}

nav .links a::after {
  content: '';
  position: absolute;
  bottom: -4px; left: 0;
  width: 0; height: 1px;
  background: var(--red);
  transition: width 0.3s ease;
}

nav .links a:hover { color: var(--text-light); }
nav .links a:hover::after { width: 100%; }

/* ============ Hero Section ============ */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 2;
  padding: 80px 20px;
  overflow: hidden;
}

/* Dragon silhouette */
.dragon-silhouette {
  position: absolute;
  top: 5%;
  right: -5%;
  width: 55%;
  height: 50%;
  opacity: 0.06;
  z-index: 0;
  pointer-events: none;
  animation: dragonFloat 8s ease-in-out infinite;
}

@keyframes dragonFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-10px) rotate(0.5deg); }
  75% { transform: translateY(8px) rotate(-0.5deg); }
}

/* Crow silhouettes */
.crow-left {
  position: absolute;
  top: 20%;
  left: 3%;
  width: 80px;
  height: 60px;
  opacity: 0.08;
  z-index: 0;
  pointer-events: none;
  animation: crowSway 6s ease-in-out infinite;
}

.crow-right {
  position: absolute;
  top: 60%;
  right: 5%;
  width: 60px;
  height: 45px;
  opacity: 0.07;
  z-index: 0;
  pointer-events: none;
  animation: crowSway 5s ease-in-out infinite 1s;
}

@keyframes crowSway {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-15px) rotate(3deg); }
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
}

.hero-badge {
  display: inline-block;
  padding: 6px 20px;
  border: 1px solid var(--red-dark);
  border-radius: 50px;
  font-size: 0.75rem;
  letter-spacing: 6px;
  color: var(--red);
  margin-bottom: 24px;
  animation: fadeInDown 1s ease;
}

.hero h1 {
  font-size: clamp(4rem, 10vw, 8rem);
  font-weight: 900;
  color: #fff;
  letter-spacing: 16px;
  text-shadow:
    0 0 40px rgba(196,30,58,0.6),
    0 0 80px rgba(196,30,58,0.3),
    0 0 120px rgba(196,30,58,0.15),
    0 4px 8px rgba(0,0,0,0.8);
  animation: titleGlow 3s ease-in-out infinite;
  line-height: 1;
  margin-bottom: 8px;
}

@keyframes titleGlow {
  0%, 100% { text-shadow: 0 0 40px rgba(196,30,58,0.6), 0 0 80px rgba(196,30,58,0.3); }
  50% { text-shadow: 0 0 60px rgba(255,45,45,0.8), 0 0 120px rgba(196,30,58,0.5), 0 0 180px rgba(196,30,58,0.2); }
}

.hero .subtitle {
  font-size: 1.1rem;
  color: var(--text-muted);
  letter-spacing: 8px;
  animation: fadeInUp 1s ease 0.3s both;
}

.hero-divider {
  width: 120px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--red), transparent);
  margin: 24px auto;
  animation: fadeIn 1s ease 0.6s both;
}

.hero .tagline {
  font-size: 0.95rem;
  color: var(--gold);
  letter-spacing: 4px;
  animation: fadeInUp 1s ease 0.8s both;
  font-style: italic;
}

.scroll-indicator {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  animation: bounce 2s ease-in-out infinite;
  cursor: pointer;
}

.scroll-indicator svg { width: 24px; height: 24px; stroke: var(--red); }

@keyframes bounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(10px); }
}

/* Decorative line at hero bottom */
.hero::after {
  content: '';
  position: absolute;
  bottom: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(196,30,58,0.3), transparent);
  z-index: 2;
}

/* ============ Gallery Section ============ */
.gallery-section {
  position: relative;
  z-index: 2;
  padding: 80px 20px;
  max-width: 1400px;
  margin: 0 auto;
}

.section-header {
  text-align: center;
  margin-bottom: 60px;
}

.section-header .icon-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 12px;
}

.section-header .icon-row svg {
  width: 28px; height: 28px;
  fill: var(--red);
  opacity: 0.6;
}

.section-header h2 {
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-light);
  letter-spacing: 6px;
}

.section-header .sub {
  font-size: 0.85rem;
  color: var(--text-muted);
  letter-spacing: 4px;
  margin-top: 8px;
}

/* Gallery Grid */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.gallery-item {
  position: relative;
  aspect-ratio: 3/4;
  overflow: hidden;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg-card);
  transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
}

.gallery-item:hover {
  transform: translateY(-4px);
  border-color: var(--red);
  box-shadow: 0 8px 32px rgba(196,30,58,0.25), 0 0 0 1px var(--red);
}

.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
  filter: brightness(0.85);
}

.gallery-item:hover img {
  transform: scale(1.08);
  filter: brightness(1.05);
}

.gallery-item .overlay {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 20px;
  background: linear-gradient(transparent, rgba(5,5,5,0.9));
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.4s ease;
}

.gallery-item:hover .overlay {
  opacity: 1;
  transform: translateY(0);
}

.gallery-item .overlay span {
  color: var(--text-light);
  font-size: 0.85rem;
  letter-spacing: 2px;
}

/* ============ Lightbox ============ */
.lightbox {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(2,2,2,0.96);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.lightbox.active { display: flex; }

.lightbox img {
  max-width: 90vw;
  max-height: 80vh;
  object-fit: contain;
  border: 1px solid var(--red-dark);
  box-shadow: 0 0 60px rgba(196,30,58,0.2);
  border-radius: 2px;
  animation: zoomIn 0.3s ease;
}

@keyframes zoomIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.lightbox-close {
  position: absolute;
  top: 24px; right: 32px;
  font-size: 2rem;
  color: var(--text-muted);
  cursor: pointer;
  z-index: 1001;
  width: 48px; height: 48px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid transparent;
  border-radius: 50%;
  transition: all 0.3s ease;
  background: none;
}

.lightbox-close:hover {
  color: var(--red);
  border-color: var(--red-dark);
}

.lightbox-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 2rem;
  color: var(--text-muted);
  cursor: pointer;
  z-index: 1001;
  width: 56px; height: 56px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid transparent;
  border-radius: 50%;
  transition: all 0.3s ease;
  background: none;
}

.lightbox-nav:hover { color: var(--red); border-color: var(--red-dark); }
.lightbox-prev { left: 24px; }
.lightbox-next { right: 24px; }

.lightbox-counter {
  position: absolute;
  bottom: 32px;
  color: var(--text-muted);
  font-size: 0.85rem;
  letter-spacing: 4px;
}

/* ============ Quotes Section ============ */
.quotes-section {
  position: relative;
  z-index: 2;
  padding: 100px 20px;
  background: linear-gradient(180deg, transparent, rgba(196,30,58,0.02), transparent);
}

.quotes-container {
  max-width: 800px;
  margin: 0 auto;
  text-align: center;
  position: relative;
}

.quotes-crow {
  position: absolute;
  top: -80px;
  right: -40px;
  opacity: 0.06;
  pointer-events: none;
  animation: crowSway 7s ease-in-out infinite;
}

.quote-mark {
  font-size: 5rem;
  color: var(--red);
  opacity: 0.3;
  line-height: 1;
  font-family: Georgia, serif;
  margin-bottom: -20px;
}

.quote-text {
  font-size: 1.3rem;
  color: var(--text-light);
  letter-spacing: 2px;
  line-height: 2;
  min-height: 80px;
  transition: all 0.5s ease;
  padding: 0 20px;
}

.quote-divider {
  width: 60px;
  height: 1px;
  background: var(--red-dark);
  margin: 20px auto;
  opacity: 0.5;
}

.quote-dots {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 20px;
}

.quote-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--red-dim);
  cursor: pointer;
  transition: all 0.3s ease;
}

.quote-dot.active {
  background: var(--red);
  box-shadow: 0 0 10px var(--red-glow);
  width: 24px;
  border-radius: 4px;
}

/* ============ Footer ============ */
footer {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 60px 20px 40px;
  border-top: 1px solid var(--border);
}

footer .footer-dragon {
  opacity: 0.04;
  margin-bottom: 20px;
  animation: dragonFloat 10s ease-in-out infinite;
}

footer p {
  color: var(--text-muted);
  font-size: 0.8rem;
  letter-spacing: 4px;
}

footer .heart {
  color: var(--red);
  display: inline-block;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.3); }
  30% { transform: scale(1); }
}

/* ============ Keyframe Animations ============ */
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ============ Responsive ============ */
@media (max-width: 768px) {
  nav { padding: 12px 16px; }
  nav .links { gap: 16px; }
  nav .links a { font-size: 0.75rem; letter-spacing: 1px; }
  .hero h1 { letter-spacing: 8px; }
  .gallery { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
  .gallery-item { aspect-ratio: 2/3; }
  .quote-text { font-size: 1rem; }
  .lightbox-nav { width: 40px; height: 40px; font-size: 1.5rem; }
  .lightbox-prev { left: 8px; }
  .lightbox-next { right: 8px; }
}

/* ============ Music Player ============ */
.music-player {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 200;
  background: rgba(8, 8, 8, 0.97);
  border-top: 1px solid rgba(196, 30, 58, 0.25);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 0 16px;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.player-main {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  height: 100%;
}

.player-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.9rem;
  padding: 5px;
  border-radius: 4px;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  flex-shrink: 0;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 3px;
}

.player-btn:hover { color: var(--red); }
.player-btn.play-btn { font-size: 1.1rem; color: var(--text-light); }
.player-btn.play-btn:hover { color: var(--red-glow); }
.player-btn.active { color: var(--red); }

.player-info {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.player-title {
  font-size: 0.8rem;
  color: var(--text-light);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 1px;
  flex-shrink: 0;
  max-width: 180px;
}

.player-progress-wrap {
  flex: 1;
  height: 24px;
  display: flex;
  align-items: center;
  cursor: pointer;
  min-width: 50px;
}

.player-progress {
  width: 100%;
  height: 3px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  position: relative;
  overflow: visible;
}

.player-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--red-dark), var(--red));
  border-radius: 2px;
  width: 0%;
  position: relative;
  transition: width 0.15s linear;
}

.player-progress-fill::after {
  content: '';
  position: absolute;
  right: -4px;
  top: -2.5px;
  width: 8px;
  height: 8px;
  background: var(--red-glow);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--red-glow);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.player-progress-wrap:hover .player-progress-fill::after { opacity: 1; }

.player-time {
  font-size: 0.68rem;
  color: var(--text-muted);
  letter-spacing: 1px;
  flex-shrink: 0;
  min-width: 96px;
  text-align: right;
}

/* Volume control */
.player-volume {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}

.volume-icon-btn {
  width: 26px;
  height: 26px;
  padding: 2px;
}

.volume-slider-wrap {
  width: 56px;
  height: 24px;
  display: flex;
  align-items: center;
  cursor: pointer;
}

.volume-slider {
  width: 100%;
  height: 3px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  position: relative;
  overflow: visible;
}

.volume-slider-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--red-dark), var(--red));
  border-radius: 2px;
  width: 50%;
  position: relative;
}

.volume-slider-fill::after {
  content: '';
  position: absolute;
  right: -4px;
  top: -2.5px;
  width: 8px;
  height: 8px;
  background: var(--red-glow);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--red-glow);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.volume-slider-wrap:hover .volume-slider-fill::after { opacity: 1; }

.player-mode-btn, .player-list-btn {
  background: none;
  border: 1px solid transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.72rem;
  padding: 4px 8px;
  border-radius: 4px;
  transition: all 0.2s ease;
  flex-shrink: 0;
  letter-spacing: 1px;
  white-space: nowrap;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 3px;
}

.player-mode-btn:hover, .player-list-btn:hover { color: var(--red); border-color: var(--red-dark); }
.player-mode-btn.single { color: var(--red); border-color: var(--red-dark); }

/* Player button icons */
.btn-icon {
	width: 16px;
	height: 16px;
	object-fit: contain;
	flex-shrink: 0;
	opacity: 0.75;
}

.player-mode-btn:hover .btn-icon,
.player-mode-btn.single .btn-icon,
.player-list-btn:hover .btn-icon {
	opacity: 1;
}

/* Playlist Panel */
.player-playlist {
  position: fixed;
  bottom: 48px;
  right: 12px;
  width: 340px;
  max-height: 380px;
  background: rgba(10, 10, 10, 0.98);
  border: 1px solid rgba(196, 30, 58, 0.25);
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  z-index: 199;
  overflow-y: auto;
  display: none;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.6);
  scrollbar-width: thin;
  scrollbar-color: var(--red-dark) transparent;
}

.player-playlist.open { display: block; animation: slideUp 0.25s ease; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.playlist-header {
  padding: 14px 16px;
  font-size: 0.78rem;
  color: var(--text-muted);
  letter-spacing: 2px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: rgba(10,10,10,0.98);
  z-index: 1;
}

.playlist-close {
  background: none; border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.9rem;
  padding: 2px 6px;
  border-radius: 3px;
}
.playlist-close:hover { color: var(--red); }

.playlist-item {
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: grab;
  border-bottom: 1px solid rgba(255,255,255,0.02);
  transition: all 0.2s ease;
  font-size: 0.78rem;
  color: var(--text-muted);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 3px;
}

.playlist-item:hover { background: rgba(255,255,255,0.03); color: var(--text-light); }
.playlist-item.current { color: var(--red); }
.playlist-item.drag-over { border-top: 2px solid var(--red); }
.playlist-item .drag-handle {
  cursor: grab;
  color: var(--text-muted);
  font-size: 0.85rem;
  opacity: 0.4;
  flex-shrink: 0;
}

/* Toast */
.player-toast {
  position: fixed;
  bottom: 62px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(196, 30, 58, 0.9);
  color: #fff;
  padding: 7px 22px;
  border-radius: 20px;
  font-size: 0.78rem;
  letter-spacing: 2px;
  z-index: 300;
  opacity: 0;
  transition: opacity 0.35s ease;
  pointer-events: none;
}
.player-toast.show { opacity: 1; }

@media (max-width: 768px) {
  .player-title { max-width: 70px; font-size: 0.72rem; }
  .player-time { min-width: 72px; font-size: 0.62rem; }
  .player-playlist { width: calc(100% - 16px); right: 8px; border-radius: 8px 8px 0 0; max-height: 300px; }
  .music-player { padding: 0 8px; gap: 4px; }
  .player-btn { width: 26px; height: 26px; font-size: 0.78rem; }
  .player-mode-btn, .player-list-btn { font-size: 0.65rem; padding: 3px 5px; }
  .btn-icon { width: 14px; height: 14px; }
  .volume-slider-wrap { width: 36px; }
}
</style>
</head>

// ============ Particle System (Fire Embers) ============
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
let animationId;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Ember {
  constructor() {
    this.reset();
    this.y = Math.random() * canvas.height; // Start at random height
  }

  reset() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + 10;
    this.size = Math.random() * 2.5 + 0.5;
    this.speedY = -(Math.random() * 0.8 + 0.2);
    this.speedX = (Math.random() - 0.5) * 0.5;
    this.opacity = Math.random() * 0.5 + 0.2;
    this.life = 0;
    this.maxLife = Math.random() * 0.6 + 0.4;
    this.hue = Math.random() < 0.7 ? 0 : 30; // Mostly red, some orange
  }

  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.life += 0.002;
    if (this.y < -20 || this.life > this.maxLife) {
      this.reset();
      this.y = canvas.height + 10;
      this.life = 0;
    }
  }

  draw() {
    const alpha = this.opacity * (1 - this.life / this.maxLife);
    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
    if (this.hue === 0) {
      gradient.addColorStop(0, `rgba(255, 60, 30, ${alpha})`);
      gradient.addColorStop(0.5, `rgba(200, 20, 20, ${alpha * 0.6})`);
      gradient.addColorStop(1, `rgba(150, 0, 0, 0)`);
    } else {
      gradient.addColorStop(0, `rgba(255, 140, 30, ${alpha})`);
      gradient.addColorStop(0.5, `rgba(220, 100, 20, ${alpha * 0.5})`);
      gradient.addColorStop(1, `rgba(180, 60, 0, 0)`);
    }
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
  }
}

// Initialize particles
const particleCount = 80;
for (let i = 0; i < particleCount; i++) {
  particles.push(new Ember());
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.update();
    p.draw();
  });
  animationId = requestAnimationFrame(animate);
}

function formatTime(sec) {
  if (isNaN(sec) || !isFinite(sec)) return '00:00';
  var m = Math.floor(sec / 60);
  var s = Math.floor(sec % 60);
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function togglePlay() {
  if (!bgm.src || bgm.src === window.location.href) {
    loadTrack(0);
  }
  if (bgm.paused) {
    bgm.play().then(function() { updatePlayBtn(); }).catch(function() { showToast('点击任意位置开始播放'); });
  } else {
    bgm.pause();
    updatePlayBtn();
  }
}

function playNext() {
  currentTrack = (currentTrack + 1) % musicFiles.length;
  playTrack(currentTrack);
}

function playPrev() {
  currentTrack = (currentTrack - 1 + musicFiles.length) % musicFiles.length;
  playTrack(currentTrack);
}

function toggleMode() {
  if (playMode === 'list-loop') {
    playMode = 'shuffle';
    showToast('随机播放');
  } else if (playMode === 'shuffle') {
    playMode = 'single-loop';
    showToast('单曲循环');
  } else {
    playMode = 'list-loop';
    showToast('列表循环');
  }
  updateModeBtn();
}

function togglePlaylist() {
  playerPlaylist.classList.toggle('open');
}

btnPlaylistClose.addEventListener('click', function() { playerPlaylist.classList.remove('open'); });

document.addEventListener('click', function(e) {
  if (!playerPlaylist.contains(e.target) && e.target !== btnPlaylist) {
    playerPlaylist.classList.remove('open');
  }
});

function renderPlaylist() {
  playlistItems.innerHTML = '';
  playlistOrder.forEach(function(fileIndex, displayIndex) {
    var item = document.createElement('div');
    item.className = 'playlist-item' + (displayIndex === currentTrack ? ' current' : '');
    item.draggable = true;
    item.dataset.index = displayIndex;
    var name = musicFiles[fileIndex].replace('.mp3','');
    item.innerHTML = '<span class="drag-handle">≡</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + name + '</span>';

    item.addEventListener('click', function() {
      playTrack(parseInt(this.dataset.index));
      playerPlaylist.classList.remove('open');
    });

    item.addEventListener('dragstart', function(e) {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', this.dataset.index);
      this.style.opacity = '0.4';
    });
    item.addEventListener('dragend', function() { this.style.opacity = '1'; });
    item.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      this.classList.add('drag-over');
    });
    item.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
    item.addEventListener('drop', function(e) {
      e.preventDefault();
      this.classList.remove('drag-over');
      var fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
      var toIdx = parseInt(this.dataset.index);
      if (fromIdx !== toIdx) {
        var currentFile = playlistOrder[currentTrack];
        var moved = playlistOrder.splice(fromIdx, 1)[0];
        playlistOrder.splice(toIdx, 0, moved);
        currentTrack = playlistOrder.indexOf(currentFile);
        renderPlaylist();
      }
    });
    playlistItems.appendChild(item);
  });
}

progressWrap.addEventListener('click', function(e) {
  var rect = progressWrap.getBoundingClientRect();
  var fraction = (e.clientX - rect.left) / rect.width;
  if (bgm.duration && isFinite(bgm.duration)) {
    bgm.currentTime = fraction * bgm.duration;
  }
});

btnPlay.addEventListener('click', togglePlay);
btnNext.addEventListener('click', playNext);
btnPrev.addEventListener('click', playPrev);
btnMode.addEventListener('click', toggleMode);
btnPlaylist.addEventListener('click', togglePlaylist);
bgm.addEventListener('timeupdate', updateProgress);
bgm.addEventListener('play', updatePlayBtn);
bgm.addEventListener('pause', updatePlayBtn);
bgm.addEventListener('ended', function() {
  if (playMode === 'single-loop') {
    bgm.currentTime = 0;
    bgm.play().catch(function() {});
  } else if (playMode === 'shuffle') {
    var next;
    do {
      next = Math.floor(Math.random() * musicFiles.length);
    } while (next === currentTrack && musicFiles.length > 1);
    playTrack(next);
  } else {
    playNext();
  }
});
bgm.addEventListener('error', function() {
  showToast('加载失败，正在跳过...');
  setTimeout(playNext, 1500);
});

// Volume control
var volume = 0.5;
var isMuted = false;
var volumeIconEl = document.getElementById('volumeIcon');
var volumeSliderFill = document.getElementById('volumeSliderFill');
var volumeSliderWrap = document.getElementById('volumeSliderWrap');
var btnVolumeIcon = document.getElementById('btnVolumeIcon');

function updateVolumeIcon() {
	var vol = isMuted ? 0 : volume;
	if (vol <= 0.3) {
		volumeIconEl.src = 'icon/volume-low.png';
	} else if (vol <= 0.6) {
		volumeIconEl.src = 'icon/volume-medium.png';
	} else {
		volumeIconEl.src = 'icon/volume-large.png';
	}
	volumeSliderFill.style.width = (vol * 100) + '%';
}

function setVolume(fraction) {
	volume = Math.max(0, Math.min(1, fraction));
	bgm.volume = volume;
	isMuted = false;
	updateVolumeIcon();
}

function toggleMute() {
	isMuted = !isMuted;
	bgm.volume = isMuted ? 0 : volume;
	updateVolumeIcon();
}

volumeSliderWrap.addEventListener('click', function(e) {
	var rect = volumeSliderWrap.getBoundingClientRect();
	var fraction = (e.clientX - rect.left) / rect.width;
	setVolume(fraction);
});

btnVolumeIcon.addEventListener('click', function(e) {
	e.stopPropagation();
	toggleMute();
});

// Auto-play
function tryAutoPlay() {
  loadTrack(0);
  bgm.volume = 0.5;
  bgm.play().then(function() {
    updatePlayBtn();
    updateProgress();
  }).catch(function() {
    document.addEventListener('click', function startOnClick() {
      if (bgm.paused && bgm.src && bgm.src !== window.location.href) {
        bgm.play().then(function() { updatePlayBtn(); });
      }
    }, { once: true });
  });
}

tryAutoPlay();
updateVolumeIcon();
renderPlaylist();
updateModeBtn();
</script>

</body>
